<div class = "crud-container">
    <h1> 👨‍🎓 STUDENT CRUD </h1>

    <form class ="student-form" (ngSubmit)="onSubmit()">
        <h2>{{editingId() === null ? 'Add Student': 'Edit Student'}}</h2>
        <div class ="form-row">
            <label> Name:
                   <input type="text"
                   [ngModel]="form().name"
                   name="name"
                    (ngModelChange)="updateField('name', $event)"
                   placeholder="Enter Name">
            </label>
        </div>
        <div class ="form-row">
            <label> Email:
                   <input type="email"
                    [ngModel]="form().email"
                    name="email"
                    (ngModelChange)="updateField('email', $event)"
                    placeholder="Enter Email">
            </label>
        </div>
        <div class ="form-row">
            <label> Marks:
                   <input type="number"
                   [ngModel]="form().marks"
                    name="marks"
                    (ngModelChange)="updateField('marks', $event)"
                    placeholder="Enter Marks">
            </label>
        </div>

        <div class="form-actions">
            <button type="Submit" class="btn btn-primary">
              {{editingId() === null ? 'Add':'Update'}}  
              </button>
            
            <!--only show cancel button while editing -->
            @if(editingId() !== null){
            <button type="button" class="btn btn-secondary" (click)="resetForm()">
               Cancel
            </button>
            }

            <table class="student-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Marks</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                    @for(student of student(); track student.id){
                        <tr>
                            <td>{{ student.id}}</td>
                             <td>{{ student.name}} </td>
                              <td>{{ student.email}} </td>
                               <td>{{ student.marks}} </td>
                                <td class="action-cell">
                                    <button
                                            type="button"
                                            class="btn btn-edit"
                                            (click)="onEdit(student)">
                                             Edit
                                    </button>

                                    <button
                                            type="button"
                                            class="btn btn-delete"
                                            (click)="onDelete(student.id)">
                                             Delete
                                    </button>
                                </td>
                        </tr>
                    }@empty {
        <tr>
          <td colspan="5" class="no-data">No students found</td>
        </tr>
      }
    </tbody>
  </table>
</div>
